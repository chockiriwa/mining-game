<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鉱山探索</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <!-- 上部ステータス -->
        <header class="top-bar">

            <div>
                <h1>鉱山探索</h1>
                <div class="sub">STEP 1 プロトタイプ</div>
            </div>

            <div class="status">
                <div>
                    鉱山Lv. <span id="mineLevel">1</span>
                </div>

                <div>
                    HP
                    <span id="hp">10</span>
                    /
                    <span id="maxHp">10</span>
                </div>
            </div>

        </header>


        <!-- ゲーム本体 -->
        <section class="game-layout">


            <!-- 鉱山画面 -->
            <div class="main-panel">

                <div class="panel-title">
                    鉱山
                </div>


                <!-- マップ -->
                <div
                    id="map"
                    class="map"
                    aria-label="鉱山マップ">
                </div>


                <!-- 移動ボタン -->
                <div class="controls">

                    <button data-move="up">
                        ↑
                    </button>

                    <div class="middle-buttons">

                        <button data-move="left">
                            ←
                        </button>

                        <button data-move="down">
                            ↓
                        </button>

                        <button data-move="right">
                            →
                        </button>

                    </div>

                </div>


                <div class="keyboard-help">
                    ↑ ↓ ← → / W A S D で移動
                </div>


                <!-- 鉱山から出る -->
                <button
                    id="leaveButton"
                    class="danger-button">
                    鉱山から出る
                </button>

            </div>



            <!-- 右側 -->
            <aside class="side-panel">


                <!-- ミニマップ -->
                <section class="info-box">

                    <div class="panel-title">
                        ミニマップ
                    </div>

                    <div
                        id="minimap"
                        class="minimap">
                    </div>

                    <div class="legend">

                        <span>
                            ● 現在地
                        </span>

                        <span>
                            ・ 探索済み
                        </span>

                        <span>
                            ？ 未探索
                        </span>

                        <span>
                            羽 帰還ポイント
                        </span>

                    </div>

                </section>



                <!-- 簡易ログ -->
                <section class="info-box log-box">

                    <div class="panel-title">
                        簡易ログ
                    </div>

                    <div
                        id="log"
                        class="log">
                    </div>

                </section>

            </aside>

        </section>



        <!-- メッセージ -->
        <div
            id="message"
            class="message">
        </div>



        <!-- 鉱山から出る確認 -->
        <div
            id="leaveModal"
            class="modal hidden">

            <div class="modal-card">

                <h2>
                    鉱山から出ますか？
                </h2>

                <p>
                    STEP 1では鉱山を終了して
                    探索画面に戻ります。
                </p>


                <div class="modal-buttons">

                    <button id="confirmLeave">
                        はい
                    </button>

                    <button id="cancelLeave">
                        いいえ
                    </button>

                </div>

            </div>

        </div>

    </main>


    <!-- ゲーム処理 -->
    <script>
        // ================================================================
        // GitHub Pages / ホーム画面Webアプリ 更新確認付き起動
        //
        // game.jsは毎回サーバーへ再検証。
        // 変更がなければキャッシュを再利用し、
        // 更新があれば新しいgame.jsを取得する。
        // ================================================================
        (function () {
            const gameRoot =
                document.querySelector("main.game");

            if (gameRoot) {
                gameRoot.style.visibility = "hidden";
            }

            const loading =
                document.createElement("div");

            loading.id = "gameBootLoading";
            loading.textContent =
                "ゲームを読み込んでいます…";

            Object.assign(
                loading.style,
                {
                    position: "fixed",
                    inset: "0",
                    zIndex: "999999",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    padding: "24px",
                    boxSizing: "border-box",
                    background: "#111318",
                    color: "#e9edf5",
                    fontFamily:
                        "system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif",
                    fontSize: "16px",
                    fontWeight: "700",
                    textAlign: "center"
                }
            );

            document.body.appendChild(
                loading
            );

            let finished = false;

            function finishBoot() {
                if (finished) {
                    return;
                }

                // game.jsのbootstrap完了まで待つ。
                if (
                    !window.__miningGameBootstrapped_STEP489 ||
                    !document.getElementById("baseOverlay")
                ) {
                    setTimeout(
                        finishBoot,
                        20
                    );
                    return;
                }

                finished = true;

                if (gameRoot) {
                    gameRoot.style.visibility = "";
                }

                loading.remove();
            }

            function showBootError(error) {
                console.error(error);

                loading.textContent =
                    "ゲームデータを読み込めませんでした。
" +
                    "通信を確認して、もう一度起動してください。";

                loading.style.whiteSpace =
                    "pre-line";
            }

            fetch(
                "game.js",
                {
                    cache: "no-cache"
                }
            )
                .then(
                    function (response) {
                        if (!response.ok) {
                            throw new Error(
                                "game.js HTTP " +
                                response.status
                            );
                        }

                        return response.blob();
                    }
                )
                .then(
                    function (blob) {
                        const url =
                            URL.createObjectURL(
                                blob
                            );

                        const script =
                            document.createElement(
                                "script"
                            );

                        script.src = url;

                        script.onload =
                            function () {
                                URL.revokeObjectURL(
                                    url
                                );

                                finishBoot();
                            };

                        script.onerror =
                            function () {
                                URL.revokeObjectURL(
                                    url
                                );

                                showBootError(
                                    new Error(
                                        "game.js execution failed"
                                    )
                                );
                            };

                        document.body.appendChild(
                            script
                        );
                    }
                )
                .catch(
                    showBootError
                );
        })();
    </script>

</body>
</html>
